<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#030712"/><stop offset=".7" stop-color="#0b1a33"/><stop offset="1" stop-color="#132d52"/>
</linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#030712"/>
</linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
