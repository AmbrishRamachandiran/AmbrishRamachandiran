<style>
.float1{animation:fl 6s ease-in-out infinite}
.float2{animation:fl 7s ease-in-out -2s infinite}
.float3{animation:fl 5s ease-in-out -4s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.grid{animation:run 1.6s linear infinite}
@keyframes run{from{transform:translateY(0)}to{transform:translateY(var(--step))}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.rise{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
